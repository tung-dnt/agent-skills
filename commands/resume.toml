description = "Restore where a previous session left off — ticked progress tree, where each in-progress task stopped, and the next step"

prompt = """
Recover the state of in-progress work after a session ended or crashed. The arguments may name a story id; empty means every story. The state lives in task notes, claim branches, and worktrees, as described in the agent-skills work-artifacts reference (references/work-artifacts.md in the plugin).

1. Resolve the artifact root. From the project, run `bash [agent-skills plugin root]/hooks/work-state.sh root`. If it reports store=repo and configured=false, propose a location using its notes and write the config (work-state.sh configure <storiesDir>) only after the user confirms; with store=vault there is nothing to propose. If it flags the old tasks/ layout, tell the user to run work-state.sh migrate.
2. Investigate read-only, in a fresh context. Spawn a read-only subagent following the agents/state-investigator.md contract. If subagents aren't available, do this yourself without editing, committing, or deleting anything. Give it the story id and resolved root, and have it:
   - run `bash [agent-skills plugin root]/hooks/work-state.sh status [story-id]` for the ticked tree
   - for every in-progress ([~]) or blocked ([!]) task, read its task note from the freshest copy. In the repo store: the worktree shown in the tree if there is one (uncommitted edits included), otherwise `git show [work-branch]:[stories-dir relative to the repo]/[story-id]/_tasks/[task-id].md`. In the vault store there is a single copy, at the path work-state.sh path [story-id] [task-id] prints (the note isn't in git, so no git show). Read the acceptance criteria, ## Design, ## Checklist, ## Log
   - where the tree shows a worktree, run `git -C [worktree] status --short` and `git -C [worktree] log -1 --oneline` to find uncommitted work and the last commit
   - report the ticked tree, then for each in-progress task: what is done (ticked criteria and checklist items, checked against the code actually present, last commit), what is uncommitted, the next step from the last log line, and a recommended next action
3. Present the report and ask the user which task to continue. Continuing a claimed task means working on its recorded work branch or worktree; never claim it again. Adopt a task whose work branch isn't this checkout only when the user confirms its previous session is gone. Then continue with /build.

Nothing is edited, committed, or deleted during steps 1 and 2.
"""
