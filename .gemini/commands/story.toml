description = "Take one story from requirements to an approved design and task plan, resuming at its current phase"

prompt = """
Work at story scope: one user-facing capability that needs several tasks, or tasks that share a contract. Steps 1–3 each end at the approval gate (`references/approval-gate.md` in the plugin): write and show the catch-up summary, run the grill-me skill rounds over the open decisions (always at least one question), and wait for the user's explicit go-ahead. Save the summary to `docs/stories/[story-id]/summary.md`, overwriting it at each gate. Never start the next step before the go-ahead.

## Before anything else

1. Resolve the artifact root. From the project, run `bash [agent-skills plugin root]/hooks/work-state.sh root`. If it reports `configured=false`, propose a location using its notes, and write the config (`work-state.sh configure <storiesDir>`) only after the user confirms. Wherever this command says `docs/stories` or `docs/epics`, use the resolved directories.
2. Read the input. The arguments may be free text, a slug, or a tracker key or URL. If it's a tracker item and a tracker tool is available, fetch its summary, description, type, parent, and children as input. The item's type is a hint, never the decider. Without a tracker, the repository's files are the tracker.
3. Check the scope against the signals in the "Scopes and Commands" section of the agent-skills work-artifacts reference (`references/work-artifacts.md` in the plugin). If the request belongs to a different scope, say so in one or two sentences with the evidence, recommend the right command, and continue only if the user confirms.

Pick the story id (a tracker key in lowercase, or a kebab-case slug), then run `bash [agent-skills plugin root]/hooks/work-state.sh phase [story-id]` and start at the step that phase names. Never redo an approved step unless the user asks.

Every subagent prompt you write ends with the subagent command rules (`references/model-routing.md` in the plugin): one plain command per shell call, with no scripts, variables, `$(…)`, or `&&` / `;` chains; the file tools for file work; no recursive deletes; and no `git push`, `ssh`, `docker run`, `docker exec`, `psql`, `kubectl`, `terraform`, or `publish`. For those it reports `needs-command`, and you run the command in this session. This keeps subagents from stopping the user with permission prompts.

## Steps

1. Spec (phase `none` or `spec`). Invoke the spec-driven-development skill and write `docs/stories/[story-id]/spec.md` with numbered functional requirements (`FR1`…) whose acceptance criteria can be tested, and non-functional requirements (`NFR1`…) as targets, drawing on `CONSTRAINTS.md` when it exists. When the story belongs to an epic, put `epic: [epic-id]` in its frontmatter and don't restate the epic.
2. Design (phase `design`). Invoke the high-level-design skill and build the spec's `## Design` section one step at a time, with a step checkpoint after each of its steps 1–11 (show `Step N/11 — <name>` and the section, ask any decision as a decision brief or else "Continue?", and wait; skip the checkpoints only if the user asked for one pass). It covers: scope and out of scope, components, flows labelled sync/async, data ownership, how each NFR is met and verified, security, rollout, and shared contracts with ids (`C1`…) and concrete examples. Compare at least two options for decisions that are hard to reverse and record ADRs. Run the fresh-context critique it calls for, then the approval gate.
3. Plan (phase `plan`). Invoke the planning-and-task-breakdown skill: write `docs/stories/[story-id]/plan.md` (a task index with dependencies and design refs, carrying the same `epic:` in its frontmatter), and one task file per task under `tasks/`, each with `status: pending`. After the approval gate, commit the spec, plan, and task files so every worktree and machine can see them.
4. Hand off (phase `build` or `done`). Show `bash [agent-skills plugin root]/hooks/work-state.sh status [story-id]` and end with the exact next command: `/task [story-id]` to build one task, or `/build auto` to build all of them in parallel. At phase `done`, recommend a whole-story review with the code-review-and-quality skill, then the shipping-and-launch skill.
"""
